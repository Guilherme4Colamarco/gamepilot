[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamepilot"
version = "0.1.0"
description = "Gerenciador de mods para jogos Windows no Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Guilherme", email = "you@example.com"}
]
keywords = ["games", "mods", "wine", "linux", "modding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Emulators",
]
dependencies = [
    "textual>=0.60.0",
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "aiofiles>=23.0",
    "toml>=0.10",
    "platformdirs>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.3.0",
    "pyinstaller>=6.0",
]

[project.scripts]
gamepilot = "gamepilot.ui.app:main"

[tool.setuptools.packages.find]
include = ["gamepilot*"]
exclude = ["assets*", "manifests*", "tests*"]

[tool.setuptools.data-files]
"share/gamepilot/manifests" = ["manifests/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
